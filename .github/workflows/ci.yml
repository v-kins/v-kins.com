name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Check notes pass the gate
        run: python3 scripts/check_notes.py

      - name: Check for en and em dashes
        run: python3 scripts/check_dashes.py .

      - name: Build family site
        run: hugo --gc --minify --cleanDestinationDir --printPathWarnings --baseURL "https://v-kins.com/"

      - name: Build personal site (validation only)
        run: hugo --config hugo.toml,hugo.tim.toml --gc --minify --cleanDestinationDir --printPathWarnings

      - name: Check site and theme behaviour
        run: node --test scripts/site.test.mjs

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/public --no-progress "public/**/*.html"
          fail: true

      - name: Check personal site internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/public-tim --no-progress "public-tim/**/*.html"
          fail: true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --exit-code 1 --verbose
